
name: modellive
description: ModelLive - a live-streaming social application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.1.4
  videosdk: ^5.0.3
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  permission_handler: 13.0.2

dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - asset/flower.png
    - asset/logo.png
    - asset/onboarding_1.png
    - asset/onboarding_2.png
    - asset/onboarding_3.png
