name: Flutter Signed Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Verify signing files
        shell: bash
        run: |
          echo "Checking signing configuration..."
          test -f android/key.properties || exit 1
          test -f android/app/modellive.jks || exit 1
          echo "[OK] android/key.properties found"
          echo "[OK] android/app/modellive.jks found"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build signed APK
        run: flutter build apk --release --no-shrink
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

      - name: Build signed AAB
        run: flutter build appbundle --release --no-shrink
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
